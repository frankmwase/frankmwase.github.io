services:
  db:
    # Preserve the existing data volume's PostgreSQL major version; verify before pinning/upgrading this image.
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private environment file}
      POSTGRES_DB: portfolio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded password in private environment file}
      API_PORT: 3001
      SITE_ORIGIN: ${SITE_ORIGIN:-https://princemwase.me}
      GRAPH_PATH: /app/knowledge-graph.json
    ports:
      - "127.0.0.1:${API_BIND_PORT:?Choose and verify a free loopback port}:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
